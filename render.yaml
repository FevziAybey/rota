databases:
  - name: rota-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: rota
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/FevziAybey/rota
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rota-db
          property: connectionString
      - key: DATA_DIR
        value: /opt/render/project/src/server/data
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # Free planda cron yok; aylık rapor için Ayarlar'dan test maili veya
  # ücretli planda aşağıdaki bloğu açıp Blueprint sync yap.
